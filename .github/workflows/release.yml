name: Release QuickConvert

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Build release
        shell: pwsh
        run: .\scripts\build-package.ps1 -SkipMachineCertificateTrust
      - name: Publish release ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Get-ChildItem .\artifacts\QuickConvert-*.zip | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $archive.FullName --generate-notes
